<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reconcile · Follow one timesheet</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235A6B2E'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='%23F3F1E7' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <button class="brand" id="home" title="Back to the start">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Reconcile</span>
      <span class="brand-sub">Meridian Field Services · demo data</span>
    </button>
    <div class="top-right">
      <button class="mode" id="mode"></button>
      <button class="ghost" id="notesBtn">Notes <kbd>N</kbd></button>
    </div>
  </header>

  <div class="app">
    <nav class="side" id="side" aria-label="Steps"></nav>
    <main>
      <div id="screen"></div>
      <div class="nav" id="nav"></div>
    </main>
  </div>

  <aside class="notes" id="notes" aria-label="Presenter notes"></aside>
  <div class="toast" id="toast" role="status"></div>

  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
